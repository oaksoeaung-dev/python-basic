{% extends "base.html" %}

{% block title%}Edit{% endblock%}

{% block body%} 

<form method="post" action="/product/edit/{{index}}">
    <p>Name</p>
    <input name="name" type="text" value="{{ current.name }}">
    <br>
    <p>Price</p>
    <input name="price" type="number"  value="{{ current.price }}">
    <br>
    <input type="submit" value="Save">
</form>

 {% endblock%}
